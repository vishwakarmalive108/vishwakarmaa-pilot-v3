name: Project Vishwakarmaa - Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project files
        shell: bash
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/vishwakarmaa/workforce/MainActivity.java
          test -f android/app/src/main/assets/index.html
          test -f package.json
          test -f codemagic.yaml

      - name: Check Node syntax
        run: node --check src/server.js

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Project-Vishwakarmaa-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
